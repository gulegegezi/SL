<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gamelife · 试用 Demo（有表演）</title>
<style>
:root{
  --wood:#704728; --woodDk:#452a14;
  --parch:#f5e8c4; --parchDk:#e5d5a7; --ink:#452f1c; --inkDim:#7b6145;
  --green:#5c9639; --gold:#b47c20; --pinkC:#c4537a;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#0d0f12;color:#cfd8e3;min-height:100vh;padding:18px;
  font-family:ui-monospace,"Cascadia Mono","Courier New","Microsoft YaHei",monospace;
  display:flex;gap:18px;justify-content:center;align-items:flex-start;flex-wrap:wrap;
}
.px{image-rendering:pixelated}

aside{width:250px;flex:0 0 auto}
aside h1{font-size:15px;color:#ffd154;margin-bottom:4px}
aside p{font-size:11.5px;color:#7d90a4;line-height:1.75;margin-bottom:10px}
aside .k{color:#5ee0f0}
.btn{font:inherit;font-size:12px;cursor:pointer;border:1px solid #37485a;background:#1a2531;
  color:#d3dfea;padding:7px 11px;border-radius:4px;transition:.13s;margin:0 6px 6px 0}
.btn:hover{background:#26384a;border-color:#5ee0f0;color:#fff}
.btn.on{background:#12303c;border-color:#5ee0f0;color:#8ef0ff}
.stat-line{display:flex;justify-content:space-between;font-size:11px;padding:2px 0;
  color:#9db0c2;border-bottom:1px dashed #22303d}
.stat-line span:last-child{color:#dfe9f3}

.phone{position:relative;width:520px;flex:0 0 auto;background:#12161c;
  border:3px solid var(--woodDk);border-radius:14px;overflow:hidden;
  box-shadow:0 18px 50px rgba(0,0,0,.65)}
.topbar{display:flex;align-items:center;gap:10px;padding:9px 14px;
  background:linear-gradient(#3a2a1e,#2a1e14);border-bottom:2px solid var(--woodDk)}
.topbar .ch{font-size:11px;color:#c9b48e;flex:1}
.topbar .ag{font-size:12px;color:var(--gold);background:var(--parch);
  border:2px solid #8a6a2a;border-radius:4px;padding:2px 9px;font-weight:700}

/* ====== 舞台 ====== */
.stage{position:relative;width:520px;height:292px;background:#000;overflow:hidden;
  border-bottom:3px solid var(--woodDk)}
.stage.shake{animation:stageShake .34s steps(1,end) 1}
@keyframes stageShake{
  0%{transform:translate(0,0)}20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-4px)}
  60%{transform:translate(-4px,-3px)}80%{transform:translate(4px,3px)}100%{transform:translate(0,0)}
}
.scene{position:absolute;left:50%;top:11px;transform:translateX(-50%);
  width:480px;height:270px}
.dark{position:absolute;inset:0;background:rgba(6,8,14,.40);pointer-events:none}
.char{position:absolute;transition:left .6s cubic-bezier(.4,0,.2,1)}
.vfx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.vfx .p{position:absolute}

/* 走 / 动作 */
.char.walking{animation:walkBob .26s linear infinite}
@keyframes walkBob{
  0%,100%{transform:translateY(0) rotate(0)}
  25%{transform:translateY(-3px) rotate(-2.5deg)}
  75%{transform:translateY(-3px) rotate(2.5deg)}
}
.char.a-hop{animation:hop .55s cubic-bezier(.3,1.4,.5,1) 1}
@keyframes hop{
  0%{transform:translateY(0) scaleY(1)}22%{transform:translateY(-18px) scaleY(1.06)}
  58%{transform:translateY(0) scaleY(.90)}78%{transform:translateY(0) scaleY(1.04)}100%{transform:translateY(0) scaleY(1)}
}
.char.a-lean{animation:lean .55s ease-out 1}
@keyframes lean{0%{transform:rotate(0)}45%{transform:rotate(8deg) translateX(5px)}100%{transform:rotate(0)}}
.char.a-sway{animation:sway .55s ease-in-out 1}
@keyframes sway{0%{transform:rotate(0)}25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}100%{transform:rotate(0)}}
.char.a-back{animation:back .55s ease-out 1}
@keyframes back{0%{transform:translateX(0)}45%{transform:translateX(-20px) rotate(-6deg)}100%{transform:translateX(-12px) rotate(-2deg)}}
.char.a-slump{animation:slump .55s ease-out 1}
@keyframes slump{0%{transform:translateY(0) scaleY(1)}55%{transform:translateY(7px) scaleY(.93)}100%{transform:translateY(5px) scaleY(.95)}}
.char.a-shiver{animation:shiver .5s linear 1}
@keyframes shiver{0%,100%{transform:translateX(0)}20%{transform:translateX(-2px)}40%{transform:translateX(2px)}
  60%{transform:translateX(-2px)}80%{transform:translateX(2px)}}
.char.a-squash{animation:squash .5s ease-out 1}
@keyframes squash{0%{transform:scale(1)}35%{transform:scale(1.10,.90)}70%{transform:scale(.96,1.04)}100%{transform:scale(1)}}

/* 结果框 */
.res{position:absolute;left:14px;right:14px;bottom:10px;background:rgba(10,14,22,.95);
  border:2px solid #7fd94a;border-radius:3px;padding:9px 12px;font-size:12.5px;
  line-height:1.65;color:#e8f4dc;opacity:0;transform:translateY(10px);
  transition:opacity .18s,transform .18s}
.res.show{opacity:1;transform:none}
.res .lab{color:#7fd94a;font-size:10.5px;margin-bottom:2px}

.banner{position:absolute;left:0;right:0;top:46%;text-align:center;pointer-events:none;
  font-size:30px;font-weight:700;color:#ffd154;text-shadow:0 2px 0 #000,0 0 18px rgba(255,209,84,.45);
  opacity:0}
.banner.show{animation:bannerIn .9s ease-out 1}
@keyframes bannerIn{
  0%{opacity:0;transform:scale(1.6)}25%{opacity:1;transform:scale(1)}
  75%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.98)}
}

/* 数值 */
.statpanel{background:var(--parchDk);border-bottom:2px solid var(--woodDk);padding:8px 12px 9px}
.sgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.scard{background:var(--parch);border:2px solid var(--wood);border-radius:3px;padding:3px 5px;text-align:center}
.scard .n{font-size:9.5px;color:var(--inkDim)}
.scard .v{font-size:13px;font-weight:700;color:var(--ink);line-height:1.15}
.abrow{display:flex;align-items:center;gap:7px;margin-top:6px}
.abrow .lb{font-size:10px;color:var(--pinkC);white-space:nowrap}
.abrow .track{flex:1;height:11px;background:#3d2e20;border:2px solid var(--wood);border-radius:2px;padding:1px}
.abrow .fill{height:100%;background:var(--pinkC);border-radius:1px;transition:width .45s cubic-bezier(.2,.8,.3,1)}
.abrow .num{font-size:10px;color:var(--inkDim);width:52px;text-align:right}

.body{padding:12px 14px 14px;background:#1a1f27}
.tagrow{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:9px}
.tag{font-size:10px;color:#8fd4ff;background:#17303c;border:1px solid #2d5a70;border-radius:9px;padding:1px 7px}
h2.title{font-size:16px;color:var(--gold);margin-bottom:6px}
p.text{font-size:13px;line-height:1.85;color:#d8e2ec;white-space:pre-line;margin-bottom:12px}

.choices{display:flex;flex-direction:column;gap:7px}
.opt{text-align:left;font:inherit;font-size:13px;cursor:pointer;background:var(--parch);
  border:2px solid var(--wood);border-radius:4px;color:var(--ink);padding:10px 12px;transition:.13s}
.opt:hover{background:#fbf3dc;border-color:var(--green);transform:translateX(2px)}
.opt:disabled{opacity:.45;cursor:default;transform:none;border-color:var(--inkDim)}
.opt.cont{background:#243a24;border-color:var(--green);color:#bff0a0;text-align:center;font-weight:700}
.opt.cont:hover{background:#2c4a2c}

.over{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  background:rgba(8,10,16,.9);color:#ffd154;z-index:20;text-align:center;padding:24px;line-height:1.9}
.over.show{display:flex}
.over .inner{max-width:420px}
.foot{font-size:10.5px;color:#5f7183;text-align:center;padding:8px;background:#12161c}
</style>
</head>
<body>

<aside>
  <h1>gamelife · 试用 Demo</h1>
  <p>剧情和数值取自仓库 <span class="k">story_opening.json</span> + <span class="k">game_data.json</span>；美术是 <span class="k">assets/chars</span>、<span class="k">assets/scenes</span> 的真实 PNG（内嵌 base64）。</p>

  <div style="margin-bottom:10px">
    <button class="btn" id="btnRestart">↻ 重开一生</button>
    <button class="btn" id="btnFast">» 快进</button>
  </div>

  <p style="color:#5ee0f0;font-size:11px;margin-bottom:5px">演出节拍</p>
  <p><b>① 走位</b>：角色从左走到目标位置（走路摆动）<br>
     <b>② 动作</b>：按选项语义演——跑跳 / 挥手 / 后退 / 瘫下 / 发抖<br>
     <b>③ 结果</b>：换表情 + 放特效 + 出结果文字</p>

  <p style="color:#5ee0f0;font-size:11px;margin:10px 0 5px">这一局</p>
  <div id="prog"></div>
</aside>

<div class="phone">
  <div class="topbar">
    <div class="ch" id="chapter">序章 · 出生</div>
    <div class="ag" id="age">0 岁</div>
  </div>

  <div class="stage" id="stage">
    <img class="scene px" id="scene" alt="">
    <div class="dark"></div>
    <img class="char px" id="charL" alt="">
    <img class="char px" id="charR" alt="">
    <div class="vfx" id="vfx"></div>
    <div class="banner" id="banner"></div>
    <div class="res" id="res"><div class="lab">结果</div><div id="resText"></div></div>
  </div>

  <div class="statpanel">
    <div class="sgrid" id="sgrid"></div>
    <div class="abrow">
      <div class="lb" id="abLabel">抽象度</div>
      <div class="track"><div class="fill" id="abFill" style="width:10%"></div></div>
      <div class="num" id="abNum">10/100</div>
    </div>
  </div>

  <div class="body">
    <div class="tagrow" id="tags"></div>
    <h2 class="title" id="title"></h2>
    <p class="text" id="text"></p>
    <div class="choices" id="choices"></div>
  </div>

  <div class="foot">序章 + 人生池试用版 · 一局约 3 分钟</div>
  <div class="over" id="over"><div class="inner" id="overText"></div></div>
</div>

3"},{"b":"把听诊器当项链戴","r":"你戴着听诊器满屋走，像一个刚下班的主任医师。你二姨说：这孩子有派头。","e":{"abstract":3,"charm":1},"g":[],"n":"OP13"}]},"OP12D":{"ch":"序章 · 抓周之后","t":"节奏","x":"你摇出了节奏，你奶奶扭了两步，你爷爷把她拉住了。\n你二姨说：这孩子以后要上春晚。你妈说：先上幼儿园。","l":"common","g":0,"c":[{"b":"跟着节奏摇头","r":"你越摇越起劲，最后把拨浪鼓敲在了自己脑门上。全场笑翻，你也跟着笑。","e":{"charm":3},"g":["乐感"],"n":"OP13"},{"b":"一鼓槌敲在桌上","r":"桌上的杯子跳了一下。你爸说：节奏感不错，就是有点费家具。","e":{"luck":2,"abstract":2},"g":[],"n":"OP13"}]},"OP12E":{"ch":"序章 · 抓周之后","t":"网络原住民","x":"屏幕还亮着，是一个短视频。你大拇指一划，又划到一个。\n你二姨说：这孩子以后能上网。你妈说：先把手机还我。","l":"common","g":0,"c":[{"b":"继续刷，刷到下一个","r":"你刷了三个视频，第四个是广告。你第一次体会到人生中的无奈。","e":{"abstract":4,"charm":1},"g":[],"n":"OP13"},{"b":"把手机扣在桌上，假装无事发生","r":"你扣得很自然。你妈看了你一眼，说：你刚才是不是刷了？你摇头。你把手机往桌边推了推。","e":{"int":2,"abstract":1},"g":[],"n":"OP13"},{"b":"对着镜头笑","r":"你对着前置摄像头笑了一下。你妈说：这孩子以后是不是要当网红。你爸说：先当个好孩子。","e":{"charm":3},"g":["镜头感"],"n":"OP13"}]},"OP12F":{"ch":"序章 · 抓周之后","t":"桂花糕","x":"你抓着桂花糕，先咬了一口。亲戚们面面相觑，然后都笑了。\n你奶奶说：民以食为天。你妈说：他连抓周都不忘吃。","l":"common","g":0,"c":[{"b":"把剩下的递给奶奶","r":"你奶奶接过去，咬了一小口，眼睛笑成了一条缝。","e":{"charm":2},"g":["孝顺"],"n":"OP13"},{"b":"三口两口吃完","r":"你吃得满脸都是。你爸说：这孩子好养活。你妈说：像你。","e":{"health":2},"g":[],"n":"OP13"}]},"OP13":{"ch":"序章 · 全家福","t":"看镜头","x":"抓周结束，摄影师让你们看镜头。你被抱在中间，身后是笑得有点僵的爸妈，桌上是你刚抓的东西。\n快门按下的前一秒，你突然意识到：这一桌人，以后要陪你走很久。","l":"common","g":0,"c":[{"b":"看镜头，笑","r":"你笑得很标准。摄影师说：这孩子上镜。","e":{"charm":2,"luck":1},"g":["上镜"],"n":{"default":"OP14","when":[{"tags":["社牛"],"next":"OP13A"}]}},{"b":"低头看自己抓的东西","r":"你低头看了很久。摄影师抓拍到了这个瞬间，后来这张照片一直放在你家的柜子上。","e":{"int":1,"abstract":2},"g":[],"n":"OP14"},{"b":"伸手去够妈妈","r":"你伸手抓住妈妈的衣领。摄影师说：别动，这张好。","e":{"charm":2,"health":1},"g":[],"n":"OP14"},{"b":"拉着摄影师合影","r":"你伸手去够摄影师。摄影师愣了一下，然后把相机递给别人，蹲下来跟你合了一张。","e":{"charm":2,"luck":1},"g":[],"n":"OP13A"},{"b":"躲到妈妈身后","r":"你把脸埋进妈妈肩膀。摄影师说：没事，我抓拍。","e":{"int":1,"abstract":1},"g":[],"n":"OP13B"}]},"OP13A":{"ch":"序章 · 全家福","t":"热闹的那张","x":"那张全家福里，你笑得最大声，连摄影师都说：这孩子以后适合上台。\n多年后你翻到这张照片，发现自己当时根本没看镜头，而是在看举着相机的摄影师。","l":"common","g":0,"c":[{"b":"把照片收进抽屉","r":"你把它压在相册最底下。每次搬家都会带上。","e":{"charm":1},"g":[],"n":"OP14"},{"b":"拿去给爸妈看","r":"你妈说：你小时候多爱笑。你爸说：现在也爱笑，就是笑点奇怪。","e":{"charm":2},"g":[],"n":"OP14"}]},"OP13B":{"ch":"序章 · 全家福","t":"安静的那张","x":"那张全家福里，你只露出半张脸。摄影师说：要不重拍一张？你妈说：不用，这样挺好。\n多年后你翻到这张照片，发现妈妈的手一直护在你背后。","l":"common","g":0,"c":[{"b":"把照片收进抽屉","r":"你把它夹进一本旧书里，书名叫《十万个为什么》。","e":{"int":1,"abstract":1},"g":[],"n":"OP14"},{"b":"拿去给爸妈看","r":"你妈说：你小时候可认生了。你爸说：现在也没好到哪去。你妈瞪了他一眼。","e":{"charm":2},"g":[],"n":"OP14"}]},"OP14":{"ch":"序章 · 完","t":"进度条","x":"照片洗出来，你被放在床头。\n从明天起，你会走路、说话、上学、长大、离开、回来。\n人生的进度条，正式开始了。","l":"common","g":1,"c":[{"b":"闭上眼睛，睡一觉","r":"你睡得很沉。梦里有人在叫你的名字，你答应了，但不知道是谁。","e":{"health":1},"g":[],"n":null},{"b":"睁大眼睛，看看这个世界","r":"你睁着眼，直到天亮。窗外的光一点一点漫进来，像有人慢慢推开一扇门。","e":{"luck":1},"g":[],"n":null}]},"C21A":{"ch":"那之后","t":"幼儿园的朋友","x":"后来那个小朋友成了你幼儿园三年里最好的朋友。\n你们一起午睡、一起抢玩具、一起被老师罚站。毕业那天，他送你一颗玻璃弹珠，说：上小学也一起玩。","l":"common","g":0,"c":[{"b":"把弹珠收好","r":"你把它放进铁皮盒。多年后搬家，你在一堆旧玩具里又找到了它。","e":{"charm":1,"luck":1},"g":[],"n":null},{"b":"当场弹一下","r":"弹珠滚进了下水道。他愣了两秒，然后说：没事，我再送你一颗。","e":{"luck":2,"abstract":1},"g":[],"n":null}]},"C21B":{"ch":"那之后","t":"烤肠","x":"妈妈最后还是走了。你在老师怀里哭了二十分钟，哭到打嗝。\n下午放学，你看见妈妈站在门口，手里拿着一根烤肠。你冲过去，把上午的委屈忘了一半。","l":"common","g":0,"c":[{"b":"先吃烤肠","r":"你咬了一大口，烫得直吸气。妈妈笑着说：慢点。","e":{"health":1,"charm":1},"g":[],"n":null},{"b":"先抱妈妈","r":"你抱住她的腿，眼泪又掉下来。她蹲下来，把你抱进怀里。","e":{"charm":2},"g":[],"n":null}]},"C21C":{"ch":"那之后","t":"小红花","x":"你蹲在角落观察了一上午，得出结论：哭得最大声的小朋友，最后得到的小红花最多。\n第二天，你尝试了这个策略。老师给了你一朵小红花，也给了你一个单独的小板凳。","l":"common","g":0,"c":[{"b":"继续研究","r":"你开始记录谁哭得最久、谁得到最多小红花。你的观察笔记后来被老师收走了。","e":{"int":2,"abstract":2},"g":[],"n":null},{"b":"换个策略","r":"你发现笑得甜的小朋友也有小红花。你决定两种都试试。","e":{"int":1,"charm":1},"g":[],"n":null}]},"C22A":{"ch":"那之后","t":"守口如瓶","x":"那之后，他偶尔会跟你分享一些事：他妈妈做的饭、他爸爸带他去的公园、他新养的一只仓鼠。\n你们没有变成最好的朋友，但你一直记得那种被信任的感觉。","l":"common","g":0,"c":[{"b":"一直替他保密","r":"你守了很多年。长大后你才明白，有些秘密的重量，是别人交给你的信任。","e":{"charm":2,"luck":1},"g":[],"n":null},{"b":"写进日记","r":"你把它写进日记，锁进抽屉。日记本的封面上，你画了一把很小的锁。","e":{"int":1,"abstract":1},"g":[],"n":null}]},"C22B":{"ch":"那之后","t":"一起走","x":"他说：我以为只有我家会这样。你说：可能很多家都这样，只是不说。\n那天放学，你们一起走了很远，谁也没提这件事。","l":"common","g":0,"c":[{"b":"陪他走回家","r":"你们绕了远路，经过一家炸串摊。他用零花钱买了两串，一人一串。","e":{"charm":2,"health":1},"g":[],"n":null},{"b":"在路口分开","r":"你看着他走进小区，才转身回家。那天的路比平时长。","e":{"int":1,"abstract":1},"g":[],"n":null}]},"C22C":{"ch":"那之后","t":"办公室","x":"后来你才知道，老师把他叫去办公室，当着好几个老师的面问了他家里的事。\n他从办公室出来的时候，眼睛是红的。你想说对不起，但没说出口。","l":"common","g":0,"c":[{"b":"追上去道歉","r":"你追上他，说：对不起。他看了你一会儿，说：没事。但你们后来再也没做过同桌。","e":{"charm":1,"abstract":1},"g":[],"n":null},{"b":"假装没看见","r":"你低下头，继续擦橡皮。那块橡皮被你擦出了一个大洞。","e":{"abstract":2,"charm":-1},"g":[],"n":null}]},"C23A":{"ch":"那之后","t":"台灯","x":"家长会结束后，你妈没有骂你。她只是把试卷摊在桌上，一道一道跟你过。\n你发现她其实很多题也不会，但她查了答案，做了笔记。","l":"common","g":0,"c":[{"b":"认真听","r":"你听得很认真。那天晚上，你们把那道大题弄懂了。你妈说：我当年要是有人教，也不至于……她没说完。","e":{"int":2},"g":[],"n":null},{"b":"说：妈，你其实不用这样","r":"你妈愣了一下，说：我知道。然后她继续讲下一题。","e":{"charm":2},"g":[],"n":null}]},"C23B":{"ch":"那之后","t":"叹气","x":"你妈在家长会结束后，从老师那里拿到了成绩单。回家的路上，她一句话也没说。\n你跟在后面，听见她叹了口气。那声叹气比骂你更难受。","l":"common","g":0,"c":[{"b":"主动认错","r":"你追上她，说：妈，我错了。她停下脚步，说：知道错就行。然后她牵住了你的手。","e":{"charm":1,"int":1},"g":[],"n":null},{"b":"解释","r":"你说这次题太难了。她听完，说：难，对大家都难。你没话说了。","e":{"abstract":2},"g":[],"n":null}]},"C23C":{"ch":"那之后","t":"饭桌","x":"班主任给你妈打了电话。你妈回家后，先笑了一分钟，然后让你把同桌请到家里吃饭。\n饭桌上，你妈说：这孩子挺讲义气。你爸说：就是脑子不太好使。","l":"common","g":0,"c":[{"b":"替同桌说话","r":"你说：他成绩比我好。你爸说：那更说明他脑子不好使，才陪你演这出。","e":{"charm":2},"g":[],"n":null},{"b":"低头吃饭","r":"你把脸埋在碗里。同桌在桌下踢了你一脚，你差点把饭喷出来。","e":{"health":1,"abstract":1},"g":[],"n":null}]},"C24A":{"ch":"那之后","t":"冰箱","x":"你妈将信将疑，拿着卷子去问了老师。老师说是58。\n回家后，你妈没有打你，只是把改过的卷子贴在冰箱上，贴了一个月。","l":"common","g":0,"c":[{"b":"每天看着它","r":"你每天开冰箱都能看见那个歪歪扭扭的88。一个月后，你妈把它揭下来，说：下次别改了。","e":{"int":2},"g":[],"n":null},{"b":"偷偷撕掉","r":"你趁你妈不在，把卷子撕了。第二天，冰箱上贴了一张新的，旁边多了四个字：诚实第一。","e":{"abstract":2,"charm":-1},"g":[],"n":null}]},"C24B":{"ch":"那之后","t":"订正","x":"你爸说：考砸一次没什么，下次别瞒着。你妈说：对，瞒着才严重。\n你点点头。那天晚上，你爸陪你把那道大题重新做了一遍，做到十一点。","l":"common","g":0,"c":[{"b":"认真订正","r":"你把错题抄进错题本。那本本子后来写满了，你一直没舍得扔。","e":{"int":2,"health":-1},"g":[],"n":null},{"b":"先睡觉","r":"你爸说：先睡吧，明天再说。你躺下后，听见他在客厅翻你的卷子。","e":{"health":1},"g":[],"n":null}]},"C24C":{"ch":"那之后","t":"纸飞机","x":"邻居把卷子送回来时，你妈正在做饭。她接过卷子，看了看分数，又看了看你。\n你说：它自己飞出去的。你妈说：那你让它自己飞回来。","l":"common","g":0,"c":[{"b":"承认","r":"你低下头，说：我考砸了。你妈把火关小，说：考砸了就考砸了，别让卷子替你背锅。","e":{"charm":1,"int":1},"g":[],"n":null},{"b":"继续嘴硬","r":"你说：真的是风。你妈说：行，那今晚风别吃饭了。你立刻改口。","e":{"abstract":3},"g":[],"n":null}]},"C25A":{"ch":"那之后","t":"薯片","x":"老师找到你后，先检查你有没有事，然后才说：下次别系鞋带了。\n回程的车上，你旁边坐了一个平时没说过话的同学，他分了你一半薯片。","l":"common","g":0,"c":[{"b":"跟他聊天","r":"你们聊了一路。后来他成了你小学阶段最后一个还记得名字的同学。","e":{"charm":1,"luck":1},"g":[],"n":null},{"b":"看窗外","r":"你把脸贴在车窗上，看树一棵一棵往后退。薯片在你手里，慢慢变软了。","e":{"abstract":2},"g":[],"n":null}]},"C25B":{"ch":"那之后","t":"冰棍","x":"你找到队伍时，老师正准备报警。看见你，她先是松了口气，然后把你狠狠批评了一顿。\n你低头认错，心里却在想：那根冰棍看起来真好吃。","l":"common","g":0,"c":[{"b":"请同学吃冰棍","r":"你买了三根，分给走丢时一起找路的人。老师也有一根，她吃完后没再批评你。","e":{"money":-2,"charm":2},"g":[],"n":null},{"b":"把这事写进作文","r":"你写了一篇《难忘的春游》，得了高分。老师在评语里写：细节真实。","e":{"int":2},"g":[],"n":null}]},"C25C":{"ch":"那之后","t":"广播","x":"工作人员把你送回队伍。老师问你怎么知道找广播，你说：电视里都这么演。\n老师说：那你电视没白看。同学们笑了，你也笑了。","l":"common","g":0,"c":[{"b":"觉得有点骄傲","r":"你挺起胸，觉得自己解决了一个大问题。虽然你其实只是站在原地等了一会儿。","e":{"charm":1,"abstract":1},"g":[],"n":null},{"b":"下次跟紧队伍","r":"你暗暗记下：系鞋带要等队伍停下来。这个习惯你保持了很多年。","e":{"int":1,"health":1},"g":[],"n":null}]},"C26A":{"ch":"那之后","t":"领唱","x":"你练了一个月，终于在比赛前拿到了领唱。\n演出那天，你唱到一半，看见台下的妈妈在擦眼睛。你差点忘了下一句。","l":"common","g":0,"c":[{"b":"唱完","r":"你把最后一句唱完了。下台后，你妈说：你刚才是不是忘词了？你说：没有，我在换气。","e":{"charm":2},"g":[],"n":null},{"b":"对妈妈笑","r":"你对着台下笑了一下。你妈后来跟所有人说：我儿子在台上对我笑。","e":{"charm":2,"luck":1},"g":[],"n":null}]},"C26B":{"ch":"那之后","t":"灯","x":"下台后，老师没有批评你。她只是说：下次记得看指挥。\n你点点头。那个替你唱的女生说：你发什么呆呢？你说：看灯。她说：灯有什么好看的。","l":"common","g":0,"c":[{"b":"解释","r":"你说：灯很亮，照得台下的人像星星。她看了你一眼，说：你说话怎么怪怪的。","e":{"int":1,"abstract":1},"g":[],"n":null},{"b":"道谢","r":"你说：谢谢你替我唱。她摆摆手，说：下次别发呆了。","e":{"charm":2},"g":[],"n":null}]},"C26C":{"ch":"那之后","t":"铅笔","x":"演出结束后，老师给每个参加的人发了一支铅笔。你没有上台，但也拿到了一支。\n你问老师：我也有吗？老师说：你也是合唱团的人。","l":"common","g":0,"c":[{"b":"把铅笔收好","r":"你把铅笔放进笔盒，一直没舍得用。很多年后，它还在那盒旧文具里。","e":{"abstract":1,"luck":1},"g":[],"n":null},{"b":"下次一定上台","r":"你跟自己说：下次一定。后来你确实上了台，虽然只是站在最后一排。","e":{"charm":1,"int":1},"g":[],"n":null}]},"C27A":{"ch":"那之后","t":"后座","x":"你学会骑车那天，你爸在后面追着跑，跑得满头大汗。\n后来你才知道，他其实一直没松手，直到你回头看见他离你很远。","l":"common","g":0,"c":[{"b":"说谢谢","r":"你说：爸，谢谢。他擦了把汗，说：谢什么，我又没干什么。","e":{"charm":2},"g":[],"n":null},{"b":"自己再骑一圈","r":"你骑了一圈又一圈。你爸坐在花坛边看着你，直到天快黑了。","e":{"health":1,"luck":1},"g":[],"n":null}]},"C27B":{"ch":"那之后","t":"旧车","x":"很多年后，你还是不太会骑车。每次看见别人骑车经过，你都会想起楼下那辆落了灰的旧车。\n有一次你试着骑了一下，发现其实没那么难。但你已经过了那个非要学会的年纪。","l":"common","g":0,"c":[{"b":"把车送给邻居小孩","r":"你把车擦干净，送给了楼下的小孩。他骑走的时候，你站在门口看了很久。","e":{"charm":2},"g":[],"n":null},{"b":"留着","r":"你把车推回储藏室。它继续落灰，像一个没拆封的选项。","e":{"abstract":2},"g":[],"n":null}]},"C27C":{"ch":"那之后","t":"刹车","x":"你爸赔了垃圾桶的钱，回来没有骂你。他只是把车修好，说：下次想骑，跟我说。\n你点点头。那天晚上，他教你捏刹车，教了很久。","l":"common","g":0,"c":[{"b":"认真学","r":"你学会了。后来你骑车载过很多人，但第一次后座上的重量，是你爸的手。","e":{"health":2},"g":[],"n":null},{"b":"说：爸，对不起","r":"你爸愣了一下，说：一辆车而已。然后他拍了拍你的头，说：人没事就行。","e":{"charm":2},"g":[],"n":null}]},"C28A":{"ch":"那之后","t":"两把伞","x":"第二天，他带了两把伞来学校，一把还给你，一把塞给你，说：以后一起走。\n你们后来一起走了三年。","l":"common","g":0,"c":[{"b":"收下","r":"你收下了。那把伞在你家放了很久，伞骨上有一道他不小心弄弯的痕迹。","e":{"charm":2,"luck":1},"g":[],"n":null},{"b":"说不用","r":"你说不用。第二天他还是带了两把。你只好收下。","e":{"charm":1,"abstract":1},"g":[],"n":null}]},"C28B":{"ch":"那之后","t":"到家了吗","x":"你到家时，衣服只湿了一点。晚上你收到他的消息：你到家了吗？\n你回：到了。他回：那就好。你盯着屏幕看了一会儿，不知道该说什么。","l":"common","g":0,"c":[{"b":"问他有没有淋湿","r":"他回：湿了一半。你回：我也是。然后你们聊了很久，聊到手机发烫。","e":{"charm":2},"g":[],"n":null},{"b":"放下手机","r":"你把手机放在床头，去洗澡。回来时，屏幕上又多了两条消息，你没回。","e":{"abstract":2},"g":[],"n":null}]},"C28C":{"ch":"那之后","t":"红烧肉","x":"走到他家楼下，你们俩都湿透了。他妈妈说：快进来擦擦。\n那天你在他们家吃了晚饭，他妈妈做了红烧肉。你第一次觉得，暴雨天也挺好。","l":"common","g":0,"c":[{"b":"夸阿姨做饭好吃","r":"他妈妈笑得合不拢嘴，又给你夹了一块。他在旁边说：我妈平时不这样的。","e":{"charm":2},"g":[],"n":null},{"b":"多吃一碗","r":"你吃了两碗饭。回家后你妈问：你在外面吃过了？你打了个饱嗝。","e":{"health":1,"charm":1},"g":[],"n":null}]},"C29A":{"ch":"那之后","t":"最后两百米","x":"你跑完了，成绩比平时快了五秒。你蹲在地上喘气，同学递给你一瓶水。\n体育老师说：你最后要是没掉队，还能再快。你说：下次。","l":"common","g":0,"c":[{"b":"说谢谢","r":"你接过水，说谢谢。那瓶水是你喝过最甜的。","e":{"charm":1,"health":1},"g":[],"n":null},{"b":"暗下决心","r":"你开始每天多跑一圈。中考体育那天，你没有掉队。","e":{"health":1,"int":1},"g":[],"n":null}]},"C29B":{"ch":"那之后","t":"两圈","x":"你的成绩刚过线。体育老师说：你这样跑，考试没问题。\n你点点头。那天放学，你一个人又在操场上跑了两圈，跑到天黑。","l":"common","g":0,"c":[{"b":"继续练","r":"你练了一个月。考试那天，你跑出了自己最好的成绩。","e":{"health":2},"g":[],"n":null},{"b":"回家吃饭","r":"你收拾书包回家。你妈做了你爱吃的菜，你说：我今天跑得还行。","e":{"health":1,"charm":1},"g":[],"n":null}]},"C29C":{"ch":"那之后","t":"医务室","x":"你蹲了一会儿，觉得没意思，又站起来走回了跑道。老师看见你，没说什么，只是按下了秒表。\n你跑完了，成绩不算好，但也没垫底。","l":"common","g":0,"c":[{"b":"去道歉","r":"你走到老师面前，说：老师，对不起。他说：下次别装了，装病比跑步累。","e":{"charm":2},"g":[],"n":null},{"b":"把这事记在心里","r":"你把这句话记了很多年：装病比跑步累。后来你很少再逃避。","e":{"int":1,"abstract":1},"g":[],"n":null}]},"C30A":{"ch":"那之后","t":"卷子","x":"电来了，大家意犹未尽。班主任说：既然这么有精神，把刚才那张卷子做完再走。\n全班哀嚎。你和几个同学对视一眼，笑了。","l":"common","g":0,"c":[{"b":"认命做题","r":"你做完最后一道大题，抬头发现教室里只剩一半人。班主任说：你倒是坐得住。","e":{"int":2},"g":[],"n":null},{"b":"偷偷传纸条","r":"你给同桌传了一张：答案借我。他回：我也在等。","e":{"charm":1,"abstract":2},"g":[],"n":null}]},"C30B":{"ch":"那之后","t":"三次","x":"下课铃响的时候，你被同桌摇醒。他说：你睡得真香，班主任看了你三次。\n你说：然后呢？他说：然后她让我别吵你。","l":"common","g":0,"c":[{"b":"去找班主任道谢","r":"你说：老师，谢谢您没叫醒我。她看了你一眼，说：我是怕你醒了更吵。","e":{"charm":2},"g":[],"n":null},{"b":"继续睡到放学","r":"你趴回去。放学时，教室里只剩你和值日生。","e":{"health":1,"abstract":1},"g":[],"n":null}]},"C30C":{"ch":"那之后","t":"以后","x":"那天之后，你们偶尔会聊起以后。他说想学计算机，你说想学新闻。\n很多年后，你在一篇文章里写到了那个停电的晚上，但没写他的名字。","l":"common","g":0,"c":[{"b":"记住那晚","r":"你记住了那晚的每一句话。很多年后，你还能想起他说话时手电筒的光。","e":{"int":1,"charm":1},"g":[],"n":null},{"b":"写进日记","r":"你把它写进日记。那页纸的边角，后来被翻得起了毛。","e":{"abstract":1,"int":1},"g":[],"n":null}]},"C31A":{"ch":"那之后","t":"二十名","x":"班主任最后把手机还给了你，但加了一个条件：下次月考进步二十名。\n你答应了。那一个月，你每天多做一套卷子，做到看见数字就想吐。","l":"common","g":0,"c":[{"b":"说到做到","r":"你进步了二十三名。班主任把手机递给你，说：说到做到，不错。","e":{"int":3,"health":-1},"g":[],"n":null},{"b":"尽力就好","r":"你进步了九名。班主任说：手机再放一个月。你说：行。","e":{"int":1,"health":1},"g":[],"n":null}]},"C31B":{"ch":"那之后","t":"座机","x":"你又被叫到办公室。班主任说：手机我先替你保管到毕业。\n你问：那我怎么联系家里？他说：用座机。你想起自己已经背不出家里的座机号了。","l":"common","g":0,"c":[{"b":"背下座机号","r":"你背了一晚上，终于记住了。后来那个号码一直存在你脑子里。","e":{"int":1,"charm":1},"g":[],"n":null},{"b":"借同学手机","r":"你开始借同学手机。借到第三次，同学说：你是不是该自己买一个。","e":{"charm":1,"abstract":1},"g":[],"n":null}]},"C31C":{"ch":"那之后","t":"老年机","x":"没有智能手机的日子，你开始看书、看窗外、看同学。\n你发现同桌笑起来有一颗虎牙，发现食堂周三的鸡腿比周五的大，发现晚霞每天都不一样。","l":"common","g":0,"c":[{"b":"继续用老年机","r":"你用到毕业。那部按键机后来被你收进抽屉，和毕业留言册放在一起。","e":{"int":2},"g":[],"n":null},{"b":"开始写日记","r":"你开始写日记。第一篇写的是：今天发现，晚霞每天都不一样。","e":{"int":1,"charm":1},"g":[],"n":null}]},"C32A":{"ch":"那之后","t":"留言","x":"很多年后，你在一场同学聚会上翻出这本册子。有人说：你当年给我写的话，我还留着。\n你问：哪句？他说：你说我以后会发财。我说：那我发财了吗？他说：没有，但我一直记得。","l":"common","g":0,"c":[{"b":"笑","r":"你笑了。那天晚上你们喝了很多，聊到饭店打烊。","e":{"charm":2},"g":[],"n":null},{"b":"敬他一杯","r":"你举起杯子，说：敬发财。他一饮而尽，说：敬记得。","e":{"charm":1,"health":-1},"g":[],"n":null}]},"C32B":{"ch":"那之后","t":"后会有期","x":"后会有期。后来你们中的大多数人，再也没有见过。\n但每次路过学校门口，你都会想起那本册子，和那些写得很用力的字。","l":"common","g":0,"c":[{"b":"回去看看","r":"你走进校门，发现操场翻新了，教室也换了位置。只有那棵老树还在。","e":{"charm":1,"luck":1},"g":[],"n":null},{"b":"继续走","r":"你在门口站了一会儿，然后继续走。身后的下课铃响了。","e":{"abstract":2},"g":[],"n":null}]},"C32C":{"ch":"那之后","t":"那幅画","x":"那幅画后来被班主任要走了，说要挂在办公室。\n你毕业那天去看，发现它真的挂在墙上，旁边是上一届学生送的锦旗。","l":"common","g":0,"c":[{"b":"有点骄傲","r":"你看了很久，然后悄悄退了出去。","e":{"charm":2},"g":[],"n":null},{"b":"觉得不好意思","r":"你觉得画得不好。班主任说：挂在这里，是因为它让我想起你们。","e":{"charm":1,"abstract":1},"g":[],"n":null}]}}};

b":"跟着第一梯队跑","r":"你跟着跑了六百米，然后掉了队。最后两百米，你听见自己的心跳比脚步声还响。","e":{"health":2},"g":["要强"]},{"b":"按自己的节奏跑","r":"你跑得不快，但一直没停。最后一百米，你超过了三个人。体育老师在终点点了点头。","e":{"health":2,"int":1},"g":[]},{"b":"装肚子疼","r":"你捂着肚子蹲下。老师看了你一眼，说：行，去医务室。你走到医务室门口，发现门锁着。","e":{"abstract":3,"int":1},"g":[]}]},{"i":"C30","t":"晚自习停电","x":"晚自习上到一半，灯突然灭了。整栋楼安静了一秒，然后爆发出欢呼。\n班主任在黑暗中喊：都坐好，别乱动。有人在角落里点起了手机手电筒。","k":{"minAge":14,"maxAge":17},"w":10,"s":"adult","c":[{"b":"拿出手机，加入光源","r":"几束光在教室里晃来晃去，像演唱会。班主任说：谁再晃，明天叫家长。光立刻少了三束。","e":{"charm":2,"abstract":1},"g":[]},{"b":"趴在桌上睡觉","r":"你睡了十五分钟，梦见自己在海边。灯亮的时候，你嘴边有一道口水印。","e":{"health":1,"abstract":2},"g":[]},{"b":"和同桌小声聊天","r":"你们从班主任的口头禅聊到食堂的菜，最后聊到以后想考去哪。灯亮的时候，你们都没说话。","e":{"charm":2,"int":1},"g":[]}]},{"i":"C31","t":"手机被没收","x":"班主任从你抽屉里抽走了手机，说：高考完再还你。\n你看着他把手机放进讲台抽屉，听见锁舌“咔哒”一声。","k":{"minAge":13,"maxAge":17},"w":10,"s":"adult","c":[{"b":"当场认错，争取宽大处理","r":"你说：老师，我就看一眼时间。班主任说：教室里有时钟。你无言以对。","e":{"charm":1,"int":1},"g":[]},{"b":"放学后去办公室偷回来","r":"你等到办公室没人，溜进去拉开抽屉。手机不在。班主任把它带回家了。","e":{"luck":2,"abstract":4},"g":[]},{"b":"接受现实，开始用老年机","r":"你从家里翻出一部按键机。同学说：你这是要出家？你说：不，我要考大学。","e":{"int":1,"abstract":-2},"g":[]}]},{"i":"C32","t":"毕业留言册","x":"毕业前，班里传起了留言册。轮到你时，上面已经写满了各种字迹：前程似锦、勿忘我、苟富贵勿相忘。\n你翻到自己的那一页，突然不知道该写什么。","k":{"minAge":15,"maxAge":18},"w":10,"s":"adult","c":[{"b":"认真给每个人写一段","r":"你写了很久，写到手腕发酸。有人看完说：你以后是不是要当作家。你说：可能吧。","e":{"charm":3,"int":1},"g":[]},{"b":"只写一句：后会有期","r":"你写得很潇洒。多年后你翻到这本册子，发现自己只给三个人写了“后会有期”。","e":{"abstract":2,"luck":1},"g":[]},{"b":"在最后一页画了一幅画","r":"你画了一间教室、一块黑板、一群没有脸的人。有人问：为什么没有脸？你说：我记不清了。","e":{"abstract":3,"charm":2},"g":[]}]},{"i":"C33","t":"一岁半的午后","x":"你在地板上爬来爬去，发现沙发底下有一个落满灰的乒乓球。\n它离你只有半臂远，但沙发底下的世界看起来很深。","k":{"minAge":1,"maxAge":2},"w":12,"s":"child","c":[{"b":"伸手够出来","r":"你够到了。球滚出来的时候，你笑得像赢了一场战争。","e":{"health":1,"luck":1},"g":[]},{"b":"叫妈妈来帮忙","r":"你妈趴在地上，用扫帚把球拨了出来。你说：谢谢。她说：你刚才是不是想自己够？","e":{"charm":2},"g":[]},{"b":"继续往里爬","r":"你爬进去，发现里面还有一只失踪很久的袜子。你把它叼了出来，全家笑翻。","e":{"abstract":2,"int":1},"g":[]}]},{"i":"C34","t":"两岁的雨","x":"窗外下雨，你趴在窗台上看水珠赛跑。\n有一颗水珠跑得特别快，把别的都甩在后面。你伸手去按它。","k":{"minAge":2,"maxAge":3},"w":12,"s":"child","c":[{"b":"数一数有几颗","r":"你数到七就乱了。你妈说：七颗也不错。你坚持说：是九颗。","e":{"int":1},"g":[]},{"b":"拍窗户，跟水珠打招呼","r":"水珠被你拍散了。你愣住，然后笑了。你妈说：它去别的地方下雨了。","e":{"charm":1,"health":1},"g":[]},{"b":"继续发呆","r":"你看了很久，直到雨停。窗外的树亮晶晶的，像刚从水里捞出来。","e":{"abstract":2},"g":[]}]}];

const NAME = {int:'智力', health:'体质', charm:'魅力', luck:'运气', money:'金钱', abstract:'抽象度', lifespan:'寿命'};
const S = {age:0, mode:'prologue', turn:0, busy:false, tags:{}, seen:{},
           st:{int:6, health:7, charm:5, luck:6, money:20, abstract:10, lifespan:78}};
let FAST = false;
const $ = id => document.getElementById(id);
const sp = (ms) => (FAST ? ms * 0.25 : ms);
const hash = s => { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return h; };

/* ================= 数值 ================= */
function clampStats(){
  const c=(k,lo,hi)=>{S.st[k]=Math.max(lo,Math.min(hi,S.st[k]));};
  c('int',0,20);c('health',0,20);c('charm',0,20);c('luck',0,20);
  c('money',0,999);c('abstract',0,100);c('lifespan',0,120);
}
function applyEffects(eff){
  const dl=[];
  for(const k in eff){ const v=eff[k]|0; if(!v) continue; S.st[k]=(S.st[k]||0)+v; dl.push({k,v}); }
  clampStats(); return dl;
}
function regressAbstract(){
  const a=S.st.abstract;
  if(a>10) S.st.abstract=Math.max(10,a-(a>=60?3:1));
  else if(a<10) S.st.abstract=Math.min(10,a+1);
}
function renderStats(){
  const keys=['int','health','charm','luck','money','lifespan'];
  $('sgrid').innerHTML=keys.map(k=>'<div class="scard"><div class="n">'+NAME[k]+'</div><div class="v">'+S.st[k]+'</div></div>').join('');
  $('abFill').style.width=S.st.abstract+'%';
  $('abNum').textContent=S.st.abstract+'/100';
  $('abLabel').textContent='抽象度 '+(S.st.abstract<31?'正常人类':S.st.abstract<61?'有点东西':S.st.abstract<86?'精神状态受关注':'已经成佛了');
}

/* ================= 场景 / 角色 ================= */
function sceneFor(age, seed){
  let pool;
  if(age<=2) pool=['home'];
  else if(age<=12) pool=['home','classroom','park'];
  else if(age<=18) pool=['classroom','park','home'];
  else if(age<=30) pool=['office','park','home'];
  else if(age<=55) pool=['office','home','hospital','park'];
  else pool=['home','park','hospital','grave'];
  return pool[hash(seed)%pool.length];
}
function baseSprite(age){
  if(age<=2) return {k:'lead_child',s:2.0};
  if(age<=12) return {k:'lead_child',s:2.7};
  if(age<=18) return {k:'lead_teen',s:3.0};
  if(age<=30) return {k:'lead_youth',s:3.0};
  if(age<=50) return {k:'lead_adult',s:3.0};
  if(age<=65) return {k:'lead_middle',s:3.0};
  return {k:'lead_elder',s:3.0};
}
function spriteSrc(age, face){
  const b=baseSprite(age);
  if(face && face!=='normal' && ART.chars[b.k+'_'+face]) return ART.chars[b.k+'_'+face];
  return ART.chars[b.k];
}
function npcFor(sc){
  return sc==='home'?'npc_parent':sc==='classroom'?'npc_teacher':sc==='office'?'npc_boss':
         sc==='park'?'npc_friend':sc==='hospital'?'npc_parent':'npc_friend';
}
const HOME_X = 104, TARGET_X = 208;
function placeChars(seed, withNpc){
  const sc=sceneFor(S.age,seed);
  $('scene').src=ART.scenes[sc];
  const b=baseSprite(S.age);
  const c=$('charL');
  c.src=spriteSrc(S.age,'normal');
  c.style.width=(24*b.s)+'px';
  c.style.height=(36*b.s)+'px';
  c.style.left=HOME_X+'px';
  c.style.top=(236-36*b.s)+'px';
  c.className='char px';
  const r=$('charR');
  if(withNpc){
    r.style.display='block';
    r.src=ART.chars[npcFor(sc)];
    r.style.width='72px'; r.style.height='108px';
    r.style.left='330px'; r.style.top='128px';
  } else r.style.display='none';
  return sc;
}

/* ================= 特效 ================= */
function fxLayer(){ const v=$('vfx'); v.innerHTML=''; return v; }
function part(v, css){ const d=document.createElement('div'); d.className='p'; d.style.cssText=css; v.appendChild(d); return d; }
function clearVfx(){ $('vfx').innerHTML=''; }

function fxCoin(v,w,h){
  for(let i=0;i<14;i++){
    const s=7+(i%3)*3, x=Math.random()*(w-s);
    const d=part(v,'left:'+x+'px;top:'+(-s-Math.random()*30)+'px;width:'+s+'px;height:'+s+'px;background:#f5c452;border-radius:1px');
    const du=520+Math.random()*380;
    d.animate([{transform:'translateY(0)'},{transform:'translateY('+(h*0.95)+'px)'}],{duration:du,easing:'cubic-bezier(.5,0,.85,.5)',fill:'both'});
    d.animate([{opacity:1},{opacity:1,offset:.7},{opacity:0}],{duration:du,fill:'both'});
    setTimeout(()=>d.remove(),du+40);
  }
}
function fxBill(v,w,h){
  for(let i=0;i<10;i++){
    const x=Math.random()*(w-12);
    const d=part(v,'left:'+x+'px;top:'+(h-16)+'px;width:11px;height:11px;background:#8fd46a');
    d.animate([{opacity:0},{opacity:1,offset:.2},{opacity:1,offset:.65},{opacity:0}],{duration:900,fill:'both'});
    d.animate([{transform:'translateY(0)'},{transform:'translateY('+(-h*0.7)+'px)'}],{duration:900,easing:'ease-out',fill:'both'});
    setTimeout(()=>d.remove(),940);
  }
}
function fxHeart(v,w,h){
  for(let i=0;i<11;i++){
    const t=i/10, side=i%2?1:-1;
    const x=w*0.5+Math.sin(t*Math.PI)*(w*0.24)*side-4;
    const y=h-24-t*(h-70);
    const d=part(v,'left:'+x+'px;top:'+y+'px;width:9px;height:9px;background:'+(i%2?'#f2a3bd':'#ff8fc0')+';border-radius:2px');
    d.animate([{opacity:0},{opacity:1,offset:.15},{opacity:1,offset:.7},{opacity:0}],{duration:900,delay:55*i,fill:'both'});
    d.animate([{transform:'translateY(0)'},{transform:'translateY(-30px)'}],{duration:900,delay:55*i,easing:'ease-out',fill:'both'});
    setTimeout(()=>d.remove(),1000+55*i);
  }
}
function fxPulse(v,w,h){
  for(let i=0;i<2;i++){
    const d=part(v,'left:'+(w*0.42)+'px;top:'+(h*0.45)+'px;width:20px;height:20px;background:#7fd94a;border-radius:50%;opacity:0');
    d.animate([{opacity:0,transform:'scale(.4)'},{opacity:.8,transform:'scale(1.2)',offset:.25},{opacity:0,transform:'scale(2.6)'}],
      {duration:700,delay:160*i,fill:'both'});
    setTimeout(()=>d.remove(),780+160*i);
  }
}
function fxDecay(v,w,h){
  const fl=part(v,'inset:0;background:#ef6a58;opacity:0;width:100%;height:100%');
  fl.animate([{opacity:0},{opacity:.26,offset:.2},{opacity:0}],{duration:460,fill:'both'});
  setTimeout(()=>fl.remove(),480);
  for(let i=0;i<10;i++){
    const x=w*0.5+(Math.random()*70-35);
    const d=part(v,'left:'+x+'px;top:'+(h*0.55)+'px;width:8px;height:8px;background:#c8402e');
    d.animate([{transform:'translate(0,0) rotate(0)',opacity:1},
               {transform:'translate('+(Math.random()*56-28).toFixed(0)+'px,'+(-h*0.42).toFixed(0)+'px) rotate('+(Math.random()*360|0)+'deg)',opacity:0}],
      {duration:640,easing:'ease-out',fill:'both'});
    setTimeout(()=>d.remove(),670);
  }
}
function fxSwirl(v,w,h){
  const cols=['#5ee0f0','#8fd4ff','#bff0ff'];
  for(let i=0;i<10;i++){
    const ang=Math.PI*2*i/10, rad=22+(i%3)*9;
    const d=part(v,'left:'+(w*0.46+Math.cos(ang)*rad)+'px;top:'+(h*0.42+Math.sin(ang)*rad)+'px;width:8px;height:8px;background:'+cols[i%3]);
    d.animate([{transform:'rotate(0) scale(.6)',opacity:1},{transform:'rotate(360deg) scale(1.3)',opacity:0}],{duration:720,fill:'both'});
    setTimeout(()=>d.remove(),740);
  }
}
function fxSpiral(v,w,h){
  const cols=['#ff4dd2','#9a66ff','#4de6ff','#4dff9a','#ffd94d'];
  for(let i=0;i<16;i++){
    const ang=i*0.9, rad=10+i*4;
    const d=part(v,'left:'+(w*0.46+Math.cos(ang)*rad)+'px;top:'+(h*0.5+Math.sin(ang)*rad)+'px;width:8px;height:8px;background:'+cols[i%5]);
    d.animate([{transform:'translate(0,0) rotate(0)',opacity:1},
               {transform:'translate('+(Math.cos(ang+2.2)*32).toFixed(0)+'px,'+(Math.sin(ang+2.2)*32).toFixed(0)+'px) rotate(180deg)',opacity:0}],
      {duration:800,easing:'ease-out',fill:'both'});
    setTimeout(()=>d.remove(),820);
  }
}
function fxConfetti(v,w,h){
  const cols=['#ef6a58','#f5c452','#7fd94a','#5ee0f0','#b98cff'];
  for(let i=0;i<24;i++){
    const x=Math.random()*w;
    const d=part(v,'left:'+x+'px;top:'+(-10-Math.random()*24)+'px;width:6px;height:8px;background:'+cols[i%5]);
    const du=760+Math.random()*420;
    d.animate([{transform:'translateY(0) rotate(0)'},{transform:'translateY('+(h+16)+'px) rotate('+(Math.random()*720-360|0)+'deg)'}],
      {duration:du,easing:'cubic-bezier(.4,0,.8,.6)',fill:'both'});
    d.animate([{opacity:1},{opacity:1,offset:.8},{opacity:0}],{duration:du,fill:'both'});
    setTimeout(()=>d.remove(),du+40);
  }
}
function fxWilt(v,w,h){
  const dk=part(v,'inset:0;background:#120e0a;opacity:0;width:100%;height:100%');
  dk.animate([{opacity:0},{opacity:.42,offset:.35},{opacity:.16}],{duration:900,fill:'both'});
  setTimeout(()=>dk.remove(),920);
  for(let i=0;i<12;i++){
    const x=Math.random()*w;
    const d=part(v,'left:'+x+'px;top:'+(h*0.5)+'px;width:5px;height:6px;background:#7a5c46');
    const du=700+Math.random()*300;
    d.animate([{transform:'translateY(0) rotate(0)'},{transform:'translateY('+(h*0.55)+'px) rotate('+(Math.random()*80-40|0)+'deg)'}],
      {duration:du,easing:'cubic-bezier(.5,0,.85,.5)',fill:'both'});
    d.animate([{opacity:1},{opacity:0}],{duration:du,fill:'both'});
    setTimeout(()=>d.remove(),du+30);
  }
}
function fxSpark(v,w,h){
  for(let i=0;i<14;i++){
    const ang=Math.PI*2*i/14, dist=34+(i%4)*16;
    const d=part(v,'left:'+(w*0.42)+'px;top:'+(h*0.46)+'px;width:8px;height:8px;background:#5ee0f0');
    d.animate([{transform:'translate(0,0)',opacity:1},
               {transform:'translate('+(Math.cos(ang)*dist).toFixed(0)+'px,'+(Math.sin(ang)*dist).toFixed(0)+'px)',opacity:0}],
      {duration:560,easing:'ease-out',fill:'both'});
    setTimeout(()=>d.remove(),580);
  }
}
function vfxFor(dl){
  const g=k=>{const f=dl.filter(d=>d.k===k); return f.length?f[0].v:0;};
  const net=dl.reduce((s,d)=>s+(d.k==='abstract'?0:d.v),0);
  const set=[];
  if(g('money')>0) set.push(fxCoin);
  if(g('money')<0) set.push(fxBill);
  if(g('charm')>0) set.push(fxHeart);
  if(g('health')>0) set.push(fxPulse);
  if(g('health')<0) set.push(fxDecay);
  if(g('luck')>0) set.push(fxSwirl);
  if(Math.abs(g('abstract'))>=4) set.push(fxSpiral);
  if(net>=6) set.push(fxConfetti);
  if(net<=-6) set.push(fxWilt);
  if(!set.length) set.push(fxSpark);
  return {set, net};
}

/* ================= 表情 ================= */
function faceFor(dl){
  const net=dl.reduce((s,d)=>s+(d.k==='abstract'?0:d.v),0);
  const abs=dl.reduce((s,d)=>s+(d.k==='abstract'?Math.abs(d.v):0),0);
  if(abs>=5) return 'shock';
  if(net>=3) return 'happy';
  if(net<=-3) return 'sad';
  if(dl.some(d=>d.k==='health'&&d.v<=-2)) return 'shock';
  return 'normal';
}

/* ================= 动作 ================= */
function actionFor(label){
  if(/不去|拒绝|不借|不投|算了|沉默|装|摆烂|躺平|放弃|不买/.test(label)) return {cls:'a-back',    tag:'后退'};
  if(/睡|休息|在家|坐|闭眼|安静/.test(label))                    return {cls:'a-slump',   tag:'歇下'};
  if(/跑|跳|球|游泳|健身|锻炼|冲/.test(label))                   return {cls:'a-hop',     tag:'动起来'};
  if(/唱|跳|琴|画|舞|游戏|弹/.test(label))                       return {cls:'a-sway',    tag:'放开'};
  if(/哭|难过|病|死|失去|痛/.test(label))                        return {cls:'a-shiver',  tag:'发抖'};
  if(/表白|约会|结婚|喜欢|相亲|抱|亲/.test(label))               return {cls:'a-lean',    tag:'靠近'};
  if(/工作|上班|加班|赚|买房|创业|考|学|写|投|存/.test(label))    return {cls:'a-squash',  tag:'出力'};
  return {cls:'a-hop', tag:'动手'};
}

/* ================= 演出节拍 ================= */
function runBeats(steps, done){
  let i=0;
  (function next(){
    if(i>=steps.length){ if(done) done(); return; }
    const s=steps[i++];
    if(s.run) s.run();
    setTimeout(next, s.dur||0);
  })();
}

function perform(choice, after){
  const stage=$('stage'), ch=$('charL');
  const acts=actionFor(choice.b);
  const dl=applyEffects(choice.e||{});
  addTags(choice.g);
  const {set,net}=vfxFor(dl);
  const face=faceFor(dl);
  const v=fxLayer();
  const w=520,h=292;

  runBeats([
    { dur: sp(620), run: function(){                 /* ① 走位 */
        ch.classList.add('walking');
        ch.style.left=TARGET_X+'px';
      }},
    { dur: sp(60),  run: function(){ ch.classList.remove('walking'); }},
    { dur: sp(620), run: function(){                 /* ② 动作 */
        ch.classList.add(acts.cls);
      }},
    { dur: sp(80),  run: function(){                 /* ③ 结果 */
        ch.classList.remove(acts.cls);
        ch.src=spriteSrc(S.age, face);
        clearVfx();
        const vv=$('vfx');
        set.forEach(fn=>{ try{ fn(vv,w,h); }catch(e){} });
        if(Math.abs(net)>=6){ stage.classList.add('shake'); setTimeout(()=>stage.classList.remove('shake'),360); }
        renderStats();
        renderTags();
        $('resText').textContent=choice.r||'';
        $('res').classList.add('show');
        if(acts.tag){
          const b=$('banner'); b.textContent=acts.tag; b.classList.remove('show');
          void b.offsetWidth; b.classList.add('show');
        }
      }},
    { dur: sp(720), run: function(){ if(after) after(); }}
  ]);
}

/* ================= 标签 ================= */
function addTags(l){ (l||[]).forEach(t=>{ if(t) S.tags[t]=true; }); }
function renderTags(){
  const vis=Object.keys(S.tags).filter(t=>!t.startsWith('_'));
  $('tags').innerHTML=vis.slice(0,12).map(t=>'<span class="tag">'+t+'</span>').join('');
}
function hasAll(l){ return (l||[]).every(t=>S.tags[t]); }
function hasNone(l){ return (l||[]).every(t=>!S.tags[t]); }

/* ================= 序章 ================= */
function resolveNext(nx){
  if(!nx) return null;
  if(typeof nx==='string') return nx;
  if(nx.when) for(const w of nx.when) if(hasAll(w.tags)) return w.next;
  return nx.default||null;
}
function showNode(id){
  const n=OPEN.n[id];
  if(!n){ startLife(); return; }
  S.mode='prologue'; S.node=id;
  $('chapter').textContent=n.ch||'序章';
  $('age').textContent=S.age+' 岁';
  $('title').textContent=n.t;
  $('text').textContent=n.x;
  $('res').classList.remove('show');
  clearVfx();
  placeChars(id,true);
  renderStats(); renderTags(); renderProgress();
  S.busy=false;

  const box=$('choices'); box.innerHTML='';
  n.c.forEach(c=>{
    const b=document.createElement('button');
    b.className='opt'; b.textContent='▸ '+c.b;
    b.onclick=()=>pick(c, n, true, box);
    box.appendChild(b);
  });
}

/* ================= 人生池 ================= */
function pickEvent(){
  const pool=EVENTS.filter(e=>{
    const k=e.k||{};
    if(k.minAge!=null && S.age<k.minAge) return false;
    if(k.maxAge!=null && S.age>k.maxAge) return false;
    if(k.notTags && !hasNone(k.notTags)) return false;
    if(k.tags && !hasAll(k.tags)) return false;
    if(S.seen[e.i]) return false;
    return true;
  });
  if(!pool.length){ S.seen={}; return pickEvent(); }
  let tot=0; pool.forEach(e=>tot+=(e.w||10));
  let r=Math.random()*tot;
  for(const e of pool){ r-=(e.w||10); if(r<=0) return e; }
  return pool[pool.length-1];
}
function startLife(){ S.mode='life'; S.age=Math.max(1,S.age); nextLife(); }
function nextLife(){
  regressAbstract();
  if(S.age>=S.st.lifespan || S.st.health<=0 || S.turn>=34){ endGame(); return; }
  const e=pickEvent();
  S.seen[e.i]=true; S.turn++; S.node=e.i;

  $('chapter').textContent='人生 · '+(e.s||'')+'  '+S.age+' 岁';
  $('age').textContent=S.age+' 岁';
  $('title').textContent=e.t;
  $('text').textContent=e.x;
  $('res').classList.remove('show');
  clearVfx();
  placeChars(e.i,true);
  renderStats(); renderTags(); renderProgress();
  S.busy=false;

  const box=$('choices'); box.innerHTML='';
  e.c.forEach(c=>{
    const b=document.createElement('button');
    b.className='opt'; b.textContent='▸ '+c.b;
    b.onclick=()=>pick(c, e, false, box);
    box.appendChild(b);
  });
}

/* ================= 统一选项处理 ================= */
function pick(c, node, isPrologue, box){
  if(S.busy) return;
  S.busy=true;
  const opts=box.querySelectorAll('.opt');
  for(let i=0;i<opts.length;i++) opts[i].disabled=true;
  box.innerHTML='';

  perform(c, function(){
    const cont=document.createElement('button');
    cont.className='opt cont';
    if(isPrologue){
      cont.textContent='继续 ▸';
      cont.onclick=function(){
        if(node.g){ startLife(); return; }
        const nx=resolveNext(c.n);
        if(!nx){ startLife(); return; }
        showNode(nx);
      };
    } else {
      cont.textContent='继续 ▸  （'+(S.age+1)+' 岁）';
      cont.onclick=function(){
        S.age += 1 + (Math.random()<0.35?1:0);
        if(S.age>=S.st.lifespan || S.st.health<=0){ endGame(); return; }
        nextLife();
      };
    }
    box.innerHTML=''; box.appendChild(cont);
  });
}

/* ================= 结算 ================= */
function endGame(){
  S.mode='end';
  const sc=Math.round(S.st.int*3+S.st.health*3+S.st.charm*2+S.st.luck+S.st.money/10+S.st.abstract*0.4);
  const rank=S.age<15?'拉完了':sc>=110?'夯':sc>=80?'人上人':sc>=50?'NPC':'拉完了';
  const why=S.st.health<=0?'身体先撑不住了':S.age>=S.st.lifespan?'活到了寿命上限':'这一局先到这里';
  $('chapter').textContent='结算'; $('age').textContent=S.age+' 岁';
  $('title').textContent='这辈子到这儿'; $('text').textContent='';
  $('choices').innerHTML=''; $('res').classList.remove('show'); clearVfx();
  $('over').classList.add('show');
  $('overText').innerHTML=
    '<div style="font-size:26px;color:#ffd154;margin-bottom:6px">'+rank+'</div>'+
    '<div style="color:#9db0c2;font-size:12px;margin-bottom:14px">'+why+' · 活到 '+S.age+' 岁 · 综合分 '+sc+'</div>'+
    '智力 '+S.st.int+' ｜ 体质 '+S.st.health+' ｜ 魅力 '+S.st.charm+' ｜ 运气 '+S.st.luck+
    '<br>金钱 '+S.st.money+' ｜ 抽象度 '+S.st.abstract+
    '<br><br><button class="btn" onclick="restart()">↻ 再来一次</button>';
  renderProgress();
}
function renderProgress(){
  const rows=['int','health','charm','luck','money','abstract'].map(k=>
    '<div class="stat-line"><span>'+NAME[k]+'</span><span>'+S.st[k]+'</span></div>').join('');
  $('prog').innerHTML='<div class="stat-line"><span>年龄</span><span>'+S.age+' / '+S.st.lifespan+'</span></div>'+
    '<div class="stat-line"><span>阶段</span><span>'+(S.mode==='prologue'?'序章':S.mode==='life'?'人生池':'已结算')+'</span></div>'+rows;
}

/* ================= 启动 ================= */
function restart(){
  S.age=0; S.mode='prologue'; S.turn=0; S.busy=false; S.tags={}; S.seen={};
  S.st={int:6,health:7,charm:5,luck:6,money:20,abstract:10,lifespan:78};
  $('over').classList.remove('show');
  clearVfx(); renderProgress();
  showNode(OPEN.start.normal);
}
$('btnRestart').onclick=restart;
$('btnFast').onclick=function(){ FAST=!FAST; this.classList.toggle('on',FAST); };
restart();
</script>
